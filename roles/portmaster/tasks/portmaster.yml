- name: Portmaster variables
  set_fact:
    preflight_portmaster_kernel_valid: "{{ (ansible_kernel.split('.')[0] | int > 5) or ((ansible_kernel.split('.')[0] | int == 5) and (ansible_kernel.split('.')[1] | int >= 7)) }}"
    preflight_portmaster_deb_is_installed: "{{ 'portmaster' in ansible_facts.packages }}"
    portmaster_installed_version: >-
      {{
        (ansible_facts.packages.portmaster[0].version
        if ('portmaster' in ansible_facts.packages and ansible_facts.packages.portmaster | length > 0)
        else None)
      }}
    portmaster_needs_update: >-
      {{
        (portmaster_major_version | int == 2) and
        (portmaster_installed_version is not none) and
        (portmaster_release_version is defined) and
        (not portmaster_installed_version is match(portmaster_release_version))
      }}

#### DEBUG MESSAGES #############
- name: Debug messages
  debug:
    msg:
      - "{{ 'Valid kernel for portmaster' if preflight_portmaster_kernel_valid else 'Invalid kernel for portmaster' }}"
      - "{{ 'Portmaster is installed' if preflight_portmaster_deb_is_installed else 'Portmaster is not installed' }}"
      - "Installation status: {{ portmaster_install_status }}"
      - "Installed Portmaster version: {{ portmaster_installed_version }}"
      - "Latest GitHub Release version: {{ portmaster_release_version | default('N/A (v1 or not fetched)') }}"
      - "Needs update / new install: {{ (preflight_portmaster_deb_is_installed == False or portmaster_needs_update | bool) }}"
  when: portmaster_debug|default(False)
#################################

- name: Check and clean corrupted Portmaster intel files (SHA256 mismatch handler)
  block:
    - name: Verify file hashes and remove index.json on mismatch
      shell: |
        python3 - << 'PYTHON_EOF'
        import json, hashlib, os

        index_path = "/var/lib/portmaster/intel/index.json"
        base_dir = "/var/lib/portmaster/intel"

        mismatch_found = False

        if os.path.exists(index_path):
            with open(index_path, "r") as f:
                try:
                    data = json.load(f)
                except Exception as e:
                    print(f"MISMATCH: Failed to parse index.json ({e}). Deleting index.json...")
                    os.remove(index_path)
                    exit(0)

            for artifact in data.get("Artifacts", []):
                filename = artifact.get("Filename")
                expected_sha = artifact.get("SHA256")
                if not filename or not expected_sha:
                    continue
                
                filepath = os.path.join(base_dir, filename)

                if os.path.exists(filepath):
                    hasher = hashlib.sha256()
                    with open(filepath, "rb") as file_obj:
                        while chunk := file_obj.read(8192):
                            hasher.update(chunk)
                    actual_sha = hasher.hexdigest()

                    if actual_sha != expected_sha:
                        print(f"MISMATCH: Hash mismatch for {filename}. Deleting index.json...")
                        mismatch_found = True
                        break
                else:
                    # Wenn eine Datei komplett fehlt, triggert das oft auch ein Neuladen
                    print(f"MISSING: {filename}. Deleting index.json...")
                    mismatch_found = True
                    break

            if mismatch_found:
                os.path.exists(index_path) and os.remove(index_path)
        PYTHON_EOF
      args:
        executable: /bin/bash
      register: intel_cleanup_result
      changed_when: "'MISMATCH:' in intel_cleanup_result.stdout or 'MISSING:' in intel_cleanup_result.stdout"

    - name: Debug intel cleanup output
      debug:
        msg: "{{ intel_cleanup_result.stdout_lines }}"
      when: 
        - portmaster_debug | default(False)
        - intel_cleanup_result is defined

  when: 
    - preflight_portmaster_kernel_valid == True
    - portmaster_install_status == True
    - ansible_facts.packages['portmaster'] is defined

- name: Ensure initial portmaster script
  block:
    - apt:
        deb: "{{ portmaster_deb_url }}"
        state: present
      register: install_result

    - name: Install missing dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
        state: present
      when: install_result.failed

    - name: reload systemd
      systemd:
        daemon_reload: yes

  rescue:
    - name: Install missing dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
        state: present
  when: >
    preflight_portmaster_kernel_valid == True and
    portmaster_install_status == True and
    (preflight_portmaster_deb_is_installed == False or portmaster_needs_update | bool)

- name: Aktiviere und starte den Portmaster-Dienst
  systemd:
    name: portmaster
    enabled: yes
    state: started
  when: >
    preflight_portmaster_kernel_valid == True and
    portmaster_install_status == True and
    (preflight_portmaster_deb_is_installed == False or portmaster_needs_update | bool)

- name: Ensure portmaster settings
  block:
    - name: Ensure the portmasteruser group exists
      group:
        name: "{{ portmaster_group }}"
        state: present

    - name: Determine existing sudo users
      shell: 'grep sudo /etc/group | cut -d: -f4 | tr , "\n"'
      changed_when: false 
      register: sudo_users

    - name: Ensure sudo users are in portmasteruser group
      user:
        name: '{{ item }}'
        groups: "{{ portmaster_group }}"
        append: yes
        state: present
      with_items: '{{ sudo_users.stdout_lines }}'

    - name: Set permissions for portmaster-start
      file:
        path: "{{ portmaster_base_path }}/portmaster-start"
        mode: 0750
      when: portmaster_major_version | int == 1

    - name: Set the group for portmaster-start to portmasteruser
      file:
        path: "{{ portmaster_base_path }}/portmaster-start"
        group: "{{ portmaster_group }}"
      when: portmaster_major_version | int == 1
  when: preflight_portmaster_kernel_valid == True and portmaster_install_status == True

- name: Ensure portmaster config / API
  block:
    - name: Check if the file exists
      stat:
        path: "{{ portmaster_api_key_file }}"
      register: api_key_file_stat

    - name: Write the generated API Key to the file
      copy:
        content: "{{ generated_api_key }}"
        dest: "{{ portmaster_api_key_file }}"
      when: not api_key_file_stat.stat.exists

    - name: Read the API Key from the file
      slurp:
        path: "{{ portmaster_api_key_file }}"
      register: api_key_content

    - name: Set the read API Key as a variable
      set_fact:
        portmaster_api_key: "{{ api_key_content.content | b64decode | regex_replace('\\\\n', '') }}"

    - name: Render templates
      template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - {src: portmaster.json.j2, dest: "{{ portmaster_config_file }}"}
        - {src: portmaster_blocklist.txt.j2, dest: "{{ portmaster_blocklist }}"}
      notify:
        - reload portmaster

  when: preflight_portmaster_kernel_valid == True and portmaster_install_status == True
########### UNINSTALL ###########

- name: Uninstall portmaster
  block:
    - name: Ensure portmaster package is absent
      apt:
        name: portmaster
        state: absent

    - name: reload systemd
      systemd:
        daemon_reload: yes
  when: preflight_portmaster_deb_is_installed == True and preflight_portmaster_kernel_valid == True and portmaster_install_status == False
